[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires CUDA GPU (auto-skipped when cuda is unavailable)",
    "gen_smoke: real (unmocked) generation — network + compute, run as its own CI step",
]
addopts = "--cov=aetherart --cov-fail-under=55"

[tool.ruff]
line-length = 100
# Vendored third-party training scripts — exclude from all ruff checks including format
exclude = [
    "scripts/_diffusers_train_text_to_image_lora_sdxl.py",
]

[tool.ruff.lint]
# E/F/W: pycodestyle errors+warnings and pyflakes (flake8 equivalents)
# I: isort import ordering
# UP: modern Python syntax (deprecated typing aliases, f-strings, etc.)
# B: flake8-bugbear (common bug patterns)
# SIM: flake8-simplify (code simplification)
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
extend-ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
# Vendored HuggingFace training scripts — not our code to reformat
# B904/B007/SIM910/SIM102/B905: all pre-existing patterns in vendored HF script
"scripts/_diffusers_train_text_to_image_lora.py" = ["E501", "B904", "B007", "SIM910", "SIM102", "B905", "UP009"]
"scripts/_diffusers_train_text_to_image_lora_sdxl.py" = ["ALL"]
# One-off diagnostic/smoke scripts — intentionally non-standard import order
"scripts/_ir_diag.py" = ["ALL"]
"scripts/_ir_diag2.py" = ["ALL"]
"scripts/_ir_diag3.py" = ["ALL"]
"scripts/_ir_test.py" = ["ALL"]
# PR 12 GPU smoke test — deferred imports after model-path setup, not production code
"scripts/_pr12_smoke.py" = ["E402", "F541", "I001"]
# sys.path.insert before imports is intentional for standalone script execution
"scripts/eval.py" = ["E402"]
"scripts/_resume_samples.py" = ["E402"]
"scripts/resume_gallery_cats456.py" = ["E402"]
# matplotlib.use("Agg") must precede pyplot import — inherent to the library
"scripts/_gen_findings_charts.py" = ["E402"]
"scripts/generate_benchmark_charts.py" = ["E402"]
"scripts/generate_clip_blindness_chart.py" = ["E402"]
# sys.path + matplotlib.use("Agg") before imports; markdown table rows in f-string can't wrap
"scripts/experiments/exp1_quantization_quality.py" = ["E402", "E501"]
"scripts/experiments/exp2_negative_prompt.py" = ["E402", "E501"]
"scripts/experiments/exp3_cfg_sweep.py" = ["E402", "E501"]
"scripts/experiments/exp4_scheduler_visual.py" = ["E402", "E501"]
"scripts/experiments/exp5_controlnet_strength.py" = ["E402", "E501"]
"scripts/experiments/exp6_lora_rank.py" = ["E402", "E501"]
"scripts/experiments/exp7_lora_data_size.py" = ["E402", "E501"]
"scripts/experiments/exp8_lora_alpha.py" = ["E402", "E501"]
"scripts/experiments/exp9_lora_trigger.py" = ["E402", "E501"]
# SDXL ports — same ignore rationale as SD 2.1 originals
"scripts/experiments/exp1_sdxl.py" = ["E402", "E501"]
"scripts/experiments/exp2_sdxl.py" = ["E402", "E501"]
"scripts/experiments/exp3_sdxl.py" = ["E402", "E501"]
"scripts/experiments/exp4_sdxl.py" = ["E402", "E501"]
"scripts/experiments/exp5_sdxl.py" = ["E402", "E501"]
"scripts/experiments/exp6_sdxl.py" = ["E402", "E501"]
"scripts/experiments/exp7_sdxl.py" = ["E402", "E501"]
# SIM113: done-counter pattern in completed experiment script — enumerate refactor not worth the churn
"scripts/experiments/exp8_sdxl.py" = ["E402", "E501", "SIM113"]
"scripts/experiments/exp9_sdxl.py" = ["E402", "E501"]
# E501: markdown table rows and schema tuples can't wrap cleanly at 100 chars
"scripts/generate_clip_blindness_sdxl.py" = ["E402", "E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = false
disallow_untyped_defs = false
files = ["aetherart"]
