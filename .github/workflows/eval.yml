name: Eval Gate

# SEMANTICS: this is a post-merge REGRESSION DETECTOR on `main`, not a per-PR blocker. A
# regression can still land on main via a normal merge — it is CAUGHT within a day (the
# nightly cron), not PREVENTED at merge time the way a required pull_request check would be.
# That is a deliberate tradeoff, not an oversight:
#
# NOT wired to pull_request: a measured, real run (docs/LATENCY_ROOT_CAUSE.md) shows a single
# SD 2.1 / DPM / 30-step CPU generation takes ~162s on a modern laptop CPU; 30 prompts is
# therefore ~80+ minutes, likely longer on a 2-core GitHub-hosted runner. Blocking every PR on
# that is impractical without GPU CI (a separate infra decision, not made here). Instead this
# runs nightly, so a regression is caught within a day of landing rather than shipping
# silently forever — the audit finding this closes
# (docs/MODEL_AUDIT.md §4: CLIP/HPS/IR measured but never gated).
#
# NOT wired to push (removed 2026-07-31): it was, but on an actively-pushed branch a new push
# lands well inside the ~80+ minute run, and `concurrency.cancel-in-progress: true` groups
# push and schedule events on the same ref together -- so a later push doesn't just cancel its
# own predecessor, it also kills a nightly cron run still in flight (confirmed: the
# 2026-07-30T08:13 UTC cron run was still executing at 09:25 when a push arrived and cancelled
# it, 72+ minutes in). Net effect measured over 46 runs (2026-07-23 through 2026-07-30): 43
# cancelled, 3 reached the end and failed on an unrelated bug (missing matplotlib dependency,
# fixed in requirements-dev.txt below) -- zero ever completed and asserted. The push trigger
# never once did its job; it only starved the nightly cron of the runtime it needs. Nightly +
# manual dispatch is the honest cadence at this runtime.
#
# --num-images 30 (added 2026-07-31): scripts/eval_prompts.yaml has grown from 30 to 90
# prompts since the baseline (reports/eval_results_20260425_124153.json, prompts_count: 30)
# was frozen, but this workflow never pinned a prompt count -- so every run was silently
# generating against all 90 current prompts (3x the baseline's own n), not the 30 the
# threshold in check_eval_gate.py was computed from. A verification run on this fix
# (gaurav-gandhi-2411/AetherArt run 30595559538) confirmed it directly: log line
# "Progress: 30/90 done | 172 min elapsed | ETA ~344 min" before the 180-min job timeout
# killed it -- full completion at that rate would take ~5.7 hours, regardless of trigger.
# eval_prompts.yaml's first 30 entries (pp_001..pp_030) are confirmed byte-identical in ID
# to the baseline's 30 -- `--num-images 30` restores the ORIGINAL n the threshold was built
# from, it is not a new/different n, so no threshold recomputation is needed or done.
#
# Revisit: if GPU-backed CI runners become available (self-hosted or a paid GitHub-hosted GPU
# tier), move this to pull_request so regressions are prevented at merge, not just detected
# after.
on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # false (not the default true): a nightly run and a manual workflow_dispatch could still
  # collide on the same ref; if they do, queue and run both rather than silently dropping one
  # the way the removed push trigger silently dropped every nightly run it overlapped.
  cancel-in-progress: false

jobs:
  clip-regression-gate:
    runs-on: ubuntu-22.04
    # 240 (was 180): the 162s/image figure in docs/LATENCY_ROOT_CAUSE.md was measured on a
    # modern laptop CPU. The verification run for the --num-images fix below measured
    # 343.5s/image on this repo's actual GitHub-hosted runner -- 30 images at that rate is
    # ~172 min alone, before install/setup/chart/upload overhead, too close to a 180-min cap.
    timeout-minutes: 240

    env:
      # Pinned model revisions — an audit finding (docs/MODEL_AUDIT.md §1) was that no
      # from_pretrained call anywhere pinned a revision, so the eval baseline was silently
      # exposed to upstream weight changes. These are commit SHAs, not the movable `main` ref
      # (HF_MODEL_ID itself is left unset — cfg.default_model's own default already matches the
      # anchor's model, sd2-community/stable-diffusion-2-1). CLIP_MODEL_REVISION is intentionally
      # NOT openai/clip-vit-base-patch32's
      # `main` HEAD — that revision only ships pytorch_model.bin, which transformers refuses to
      # torch.load on torch < 2.6 (CVE-2025-32434, the same issue docs/depth_estimators.md
      # already documents for a different model). This SHA is the safetensors-converted
      # revision, verified to load locally before being pinned here.
      HF_MODEL_REVISION: bb2154823665391b4fb29b0b9cf82a198964ee05
      CLIP_MODEL_REVISION: c237dc49a33fc61debc9276459120b7eac67e7ef

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Cache Hugging Face hub weights (pinned revisions)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-${{ env.HF_MODEL_REVISION }}-${{ env.CLIP_MODEL_REVISION }}

      - name: Install package & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Run frozen SD 2.1 30-prompt / seed-42 baseline (DPM, 30 steps, CLIP-only)
        run: |
          python scripts/eval.py \
            --schedulers DPM \
            --steps 30 \
            --scorers clip \
            --seed 42 \
            --num-images 30 \
            --run-id "ci-${{ github.run_id }}"
        # HPS/ImageReward are deliberately excluded here (--scorers clip only): both have
        # documented crash bugs (docs/lab_notebook.md:246-250,269 — Windows pyarrow SIGSEGV,
        # headless-Linux hpsv2 tkinter import crash) that are not yet patched. Extend this gate
        # to `--scorers clip,hps,imagereward` once PLAN.md tracks those fixes as landed.
        # TODO(PR 14 follow-up): add HPS/ImageReward once docs/lab_notebook.md:246-250,269 are fixed.

      - name: Check CLIP score against the SEM-derived regression threshold
        run: |
          python scripts/check_eval_gate.py \
            --candidate "reports/eval_results_ci-${{ github.run_id }}.json" \
            --scheduler DPM \
            --steps 30 \
            --n-sigma 2

      - name: Upload eval report artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-gate-report-${{ github.run_id }}
          path: |
            reports/eval_results_ci-${{ github.run_id }}.json
            reports/eval_results_ci-${{ github.run_id }}.md
            reports/eval_charts/*ci-${{ github.run_id }}*
