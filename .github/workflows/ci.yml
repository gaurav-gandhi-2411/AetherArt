name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install package & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt
          # Scorer eval deps have version conflicts (see requirements-dev.txt comments).
          # hpsv2==1.2.0 pulls pytest==7.2.0 (downgrade) and timm==1.0.27.
          # image-reward==1.5 pins timm==0.6.13 -- incompatible with hpsv2.
          # Resolution: install image-reward --no-deps, then pin timm==1.0.27 and restore pytest.
          pip install hpsv2==1.2.0
          pip install "image-reward==1.5" --no-deps
          pip install "fairscale==0.4.13" "openai-clip==1.0.1" "timm==1.0.27"
          pip install "pytest==8.4.2" "pytest-cov==6.2.1" "ruff==0.15.13" "mypy==1.16.0"

      - name: Lint (ruff check)
        run: |
          ruff check .

      - name: Format check (ruff format)
        run: |
          ruff format --check .

      - name: Type check (mypy)
        run: |
          mypy aetherart

      - name: Run tests
        run: |
          pytest --cov=aetherart --cov-report=term-missing --cov-report=html --cov-report=xml -q

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            htmlcov/
            coverage.xml
