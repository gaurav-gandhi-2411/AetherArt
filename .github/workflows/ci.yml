name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      # Same pins as .github/workflows/eval.yml — see that file for why these exact SHAs
      # (not `main`) are used. Shared here so the generation smoke test below reuses the same
      # actions/cache entry instead of downloading the weights twice across workflows.
      HF_MODEL_REVISION: bb2154823665391b4fb29b0b9cf82a198964ee05
      CLIP_MODEL_REVISION: c237dc49a33fc61debc9276459120b7eac67e7ef

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Cache Hugging Face hub weights (pinned revisions)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-${{ env.HF_MODEL_REVISION }}-${{ env.CLIP_MODEL_REVISION }}

      - name: Install scorer eval deps (conflict-managed)
        run: |
          python -m pip install --upgrade pip
          # hpsv2 is NOT installed in CI: it pins pytest==7.2.0 which conflicts with
          # pytest==8.4.2. Scorer tests use sys.modules mocking so hpsv2 does not
          # need to be importable in the test environment.
          # image-reward==1.5 and fairscale==0.4.13 are also excluded:
          #   image-reward pins timm==0.6.13 (conflicts with timm==1.0.27)
          #   fairscale builds from source and conflicts with system NCCL on ubuntu-22.04
          # All scorer tests are fully mocked; no real scorer package is needed in CI.
          pip install "openai-clip==1.0.1" "timm==1.0.27"

      - name: Install package & dependencies
        run: |
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: |
          ruff check .

      - name: Format check (ruff format)
        run: |
          ruff format --check .

      - name: Type check (mypy)
        run: |
          mypy aetherart

      - name: Run tests
        run: |
          pytest -m "not gen_smoke" --cov=aetherart --cov-report=term-missing --cov-report=html --cov-report=xml -q

      - name: Generation smoke test (real, unmocked — catches silent env/DLL breakage)
        run: |
          pytest -m gen_smoke --no-cov -q

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            htmlcov/
            coverage.xml

  manifest-provenance:
    # 2026-08-05 audit: a metric in .portfolio/metrics.json without a
    # committed artifact behind it can silently drift from what the portfolio
    # site shows, with nobody able to tell -- this is a build failure, not a
    # warning. See gg-portfolio's provenance.md wave 19 section.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Every manifest metric must have a committed artifact
        run: python scripts/check_manifest_provenance.py
