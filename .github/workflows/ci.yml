name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install scorer eval deps (conflict-managed)
        run: |
          python -m pip install --upgrade pip
          # hpsv2 is NOT installed in CI: it pins pytest==7.2.0 which conflicts with
          # pytest==8.4.2. Scorer tests use sys.modules mocking so hpsv2 does not
          # need to be importable in the test environment.
          # image-reward==1.5 and fairscale==0.4.13 are also excluded:
          #   image-reward pins timm==0.6.13 (conflicts with timm==1.0.27)
          #   fairscale builds from source and conflicts with system NCCL on ubuntu-22.04
          # All scorer tests are fully mocked; no real scorer package is needed in CI.
          pip install "openai-clip==1.0.1" "timm==1.0.27"

      - name: Install package & dependencies
        run: |
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: |
          ruff check .

      - name: Format check (ruff format)
        run: |
          ruff format --check .

      - name: Type check (mypy)
        run: |
          mypy aetherart

      - name: Run tests
        run: |
          pytest --cov=aetherart --cov-report=term-missing --cov-report=html --cov-report=xml -q

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            htmlcov/
            coverage.xml
